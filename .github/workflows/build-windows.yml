name: Build Windows app

# Runs when you change js/version.js (every new version), or when you press "Run workflow" on the Actions page.
on:
  push:
    branches: [main]
    paths: ['js/version.js']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: desktop
        run: npm install
      - name: Remember downloaded build tools
        id: tools
        uses: actions/cache/restore@v4
        with:
          path: |
            ~\AppData\Local\electron-builder\Cache
            ~\AppData\Local\electron\Cache
          key: build-tools-${{ github.run_id }}
          restore-keys: build-tools-
      - name: Build the installer
        working-directory: desktop
        shell: pwsh
        # The build downloads a few tools from GitHub. Now and then that download times out (504),
        # so we try up to 5 times, waiting a little longer each time, before giving up.
        run: |
          $ok = $false
          foreach ($i in 1..5) {
            Write-Host "Build attempt $i of 5"
            npm run dist
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "Attempt $i failed. Waiting before trying again."
            Start-Sleep -Seconds (20 * $i)
          }
          if (-not $ok) { exit 1 }
      - name: Keep downloaded build tools for next time
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~\AppData\Local\electron-builder\Cache
            ~\AppData\Local\electron\Cache
          key: build-tools-${{ github.run_id }}
      - name: Publish it as a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          Get-ChildItem desktop/dist | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          Write-Host "Publishing v$v"
          gh release delete "v$v" --cleanup-tag --yes 2>$null
          $global:LASTEXITCODE = 0
          gh release create "v$v" `
            "desktop/dist/Concorde-Setup-$v.exe" `
            "desktop/dist/Concorde-Setup-$v.exe.blockmap" `
            "desktop/dist/latest.yml" `
            --target "${{ github.sha }}" --title "Concorde v$v" --notes "Windows installer for Concorde v$v." --latest
          if ($LASTEXITCODE -ne 0) { exit 1 }
