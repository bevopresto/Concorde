name: Build Windows app

# Runs when you change js/version.js (every new version), or when you press "Run workflow" on the Actions page.
on:
  push:
    branches: [main]
    paths: ['js/version.js']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: desktop
        run: npm install
      - name: Build the installer
        working-directory: desktop
        run: npm run dist
      - name: Publish it as a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          Get-ChildItem desktop/dist | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          Write-Host "Publishing v$v"
          gh release delete "v$v" --cleanup-tag --yes 2>$null
          $global:LASTEXITCODE = 0
          gh release create "v$v" `
            "desktop/dist/Concorde-Setup-$v.exe" `
            "desktop/dist/Concorde-Setup-$v.exe.blockmap" `
            "desktop/dist/latest.yml" `
            --target "${{ github.sha }}" --title "Concorde v$v" --notes "Windows installer for Concorde v$v." --latest
          if ($LASTEXITCODE -ne 0) { exit 1 }
